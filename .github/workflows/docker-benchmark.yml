name: Docker Layer Cache Benchmark (Avrea)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: avrea-ubuntu-latest-8-vcpu
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max,url_v2=https://cache.avrea.com/
